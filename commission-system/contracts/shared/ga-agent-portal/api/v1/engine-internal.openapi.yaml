openapi: 3.1.0
info:
  title: ga-commission-engine 내부 API — 포털이 쓰는 것 (v1 골격)
  version: 1.3.0
  description: |
    엔진(테넌트별 인스턴스)이 포털에 제공하는 내부 API(설계서 §4.1·§4.3). 포털 Phase 0의 골격이며 구현은 엔진 E1(피드)·E2(동기 API·명세)에서 한다.
    인증은 서비스 토큰(운영 mTLS 권장) — 설계사 토큰으로는 접근할 수 없다.
    금액은 정수 원(integer), 요율·배수 같은 소수는 불투명 문자열(표시 전용), 날짜·시각은 pattern(format을 쓰지 않는다).
    피드 커서는 정수 afterSeq·nextSeq·headSeq 규약이다(ga-disclosure 6A 계획 승인 Q5로 재확인).
    1.1.0(포털 Phase 1 지시문 §0 K8): FeedResponse에 필수 tenantId, 401·422(AFTER_BEYOND_HEAD) 응답, limit 기본 200. 피드는 엔진 E1이 구현한다.
    1.2.0(포털 Phase 2 지시문 §0 M1): 피드에 400(INVALID_REQUEST) 응답 — 엔진 E1이 이미 내는 것.
    1.3.0(포털 Phase 2 계획 승인 §3, 엔진 E2 계획 §4 R1~R8): 동기 API의 엔진 입력(보험사·경과 회차·새 보험료) 선택 추가, 한도 미적용 계약의 결과(limitAmount·projectedAccum 선택),
      시책 금액의 정의와 삭감액, PolicyEventResult 필드의 뜻, 세 동기 API의 400·404·422 Problem, CONFIRMED 명세의 뜻. 전부 추가·완화·설명.
servers:
  - url: https://engine.invalid
security:
  - serviceToken: []
paths:
  /internal/v1/events:
    get:
      operationId: listEvents
      summary: 아웃박스 이벤트 피드(pull, 커서) — seq 오름차순, 갭 없음
      parameters:
        - name: afterSeq
          in: query
          required: true
          description: 이 seq 다음부터. 처음은 0.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: 한 번에 돌려줄 최대 건수. 없으면 200.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: 이벤트 묶음. headSeq − nextSeq가 포털의 지연 지표.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '400':
          description: 파라미터 오류(afterSeq 없음·음수, limit 범위 밖 등) — code INVALID_REQUEST(v1.2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 서비스 토큰이 없거나 틀렸다.
        '422':
          description: |
            afterSeq > headSeq — code AFTER_BEYOND_HEAD. 복원된 DB 등 다른 발행자를 읽고 있다는 뜻이다(ga-disclosure 피드와 같은 규약).
            포털은 그 테넌트를 정지한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/v1/simulations/new-contract:
    post:
      operationId: simulateNewContract
      summary: 신계약 시뮬레이션(dry-run — 영속화·원장 락 없음, 설계서 Q5)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewContractRequest'
      responses:
        '200':
          description: 엔진 결과(비확정·설계사 참고용)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewContractResult'
        '400':
          description: 요청 형식·값 오류 — code INVALID_REQUEST(v1.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |
            code AGENT_NOT_FOUND — 엔진에 없는 설계사 (v1.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            code INSURER_AMBIGUOUS — insurerCd가 없고 기준일에 그 상품의 유효 요율이 여러 보험사에 있다 (v1.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/v1/simulations/policy-event:
    post:
      operationId: simulatePolicyEvent
      summary: 해약 등 계약 이벤트 영향 시뮬레이션(dry-run, 설계서 Q4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyEventRequest'
      responses:
        '200':
          description: 엔진 결과(비확정·설계사 참고용)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyEventResult'
        '400':
          description: 요청 형식·값 오류 — code INVALID_REQUEST(v1.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |
            code AGENT_NOT_FOUND — 엔진에 없는 설계사, POLICY_NOT_FOUND — 그 설계사의 계약이 아니다 (v1.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            code UNSUPPORTED_EVENT_TYPE — 엔진이 시뮬레이션하지 않는 eventType(PAYMENT_OVERDUE) (v1.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/v1/agents/{agentId}/statements/{ym}:
    get:
      operationId: getStatement
      summary: 설계사 월 명세(대사·온디맨드 잠정 명세) — StatementEstimated/Confirmed payload와 같은 구조
      description: |
        mode=ESTIMATE — 잠정 명세 산출을 지금 실행한 결과(StatementEstimated 모양, 발행하지 않는다 — 조회는 이벤트가 아니다).
        mode=CONFIRMED — 마감·지급 사실(v1.3, R8): StatementConfirmed 모양이고, 그 달 지급 런이 끝났으면 withholdingTax·net에 그 달 지급 런의 합을 싣는다
        (지급 전이면 둘 다 없다). 같은 달의 StatementConfirmed·PayoutCompleted 이벤트와 필드 단위로 같은 값이다.
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            $ref: '../../events/v1/defs.schema.json#/$defs/agentId'
        - name: ym
          in: path
          required: true
          schema:
            $ref: '../../events/v1/defs.schema.json#/$defs/ym'
        - name: mode
          in: query
          required: true
          schema:
            enum: [ESTIMATE, CONFIRMED]
      responses:
        '200':
          description: 명세
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../../events/v1/payloads/StatementEstimated.v1.schema.json'
                  - $ref: '../../events/v1/payloads/StatementConfirmed.v1.schema.json'
        '400':
          description: 요청 형식·값 오류 — code INVALID_REQUEST(v1.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |
            code AGENT_NOT_FOUND — 엔진에 없는 설계사, STATEMENT_NOT_CONFIRMED — mode=CONFIRMED인데 그 달이 아직 마감되지 않았다 (v1.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            code MONTH_CLOSED — mode=ESTIMATE인데 그 달이 이미 마감됐다(마감월은 CONFIRMED가 정본) (v1.3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  schemas:
    FeedResponse:
      type: object
      required: [tenantId, events, nextSeq, headSeq, schemaVersion]
      properties:
        tenantId:
          $ref: '../../events/v1/defs.schema.json#/$defs/tenantId'
          description: 응답한 엔진 인스턴스의 테넌트(엔진은 테넌트별 인스턴스). 포털은 요청한 테넌트와 다르면 아무것도 적용하지 않고 그 테넌트를 정지한다(v1.1).
        events:
          type: array
          items:
            $ref: '../../events/v1/envelope.schema.json'
        nextSeq:
          type: integer
          minimum: 0
          description: 다음 요청의 afterSeq
        headSeq:
          type: integer
          minimum: 0
        schemaVersion:
          type: integer
          minimum: 1
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: 오류 코드(예 AFTER_BEYOND_HEAD)
        message:
          type: string
    NewContractRequest:
      type: object
      required: [agentId, productKey, monthlyPremium, contractDate]
      properties:
        agentId:
          $ref: '../../events/v1/defs.schema.json#/$defs/agentId'
        productKey:
          $ref: '../../events/v1/defs.schema.json#/$defs/id'
        monthlyPremium:
          $ref: '../../events/v1/defs.schema.json#/$defs/nonNegativeWon'
        contractDate:
          $ref: '../../events/v1/defs.schema.json#/$defs/date'
        paymentTermMonths:
          type: integer
          minimum: 1
        insurerCd:
          $ref: '../../events/v1/defs.schema.json#/$defs/id'
          description: 보험사 코드(v1.3, R1) — 엔진 요율의 키는 (보험사, 상품)이다. 없으면 엔진은 기준일에 그 상품의 유효 요율이 한 보험사뿐일 때만 그것으로 정하고, 아니면 422 INSURER_AMBIGUOUS.
        incentiveCodes:
          type: array
          description: 엔진 시책 마스터의 코드(v1.3, R3) — 주면 그 시책만 계산한다.
          items:
            type: string
            minLength: 1
    NewContractResult:
      type: object
      required: [fyCommissionByInstallment, incentives, deferral, ruleSnapshotId, generatedAt]
      properties:
        limitAmount:
          $ref: '../../events/v1/defs.schema.json#/$defs/nonNegativeWon'
          description: 그 계약의 한도(v1.3, R2 — 선택). 없으면 한도 미적용 계약이다(엔진이 원장을 열지 않는 계약 — 예 2026-06-30 이전 체결).
        fyCommissionByInstallment:
          type: array
          items:
            type: object
            required: [no, amount]
            properties:
              no:
                type: integer
                minimum: 1
              amount:
                $ref: '../../events/v1/defs.schema.json#/$defs/won'
        incentives:
          type: array
          items:
            type: object
            required: [code, amount, limitIncluded]
            properties:
              code:
                type: string
                minLength: 1
              amount:
                $ref: '../../events/v1/defs.schema.json#/$defs/won'
                description: 한도 삭감 뒤 지급 예정액(v1.3, R3) — CommissionCalculated.amount와 같은 정의. 요청액 = amount + limitCutAmt.
              limitCutAmt:
                $ref: '../../events/v1/defs.schema.json#/$defs/nonNegativeWon'
                description: 한도로 깎인 금액(v1.3, R3 — 선택, 없으면 0)
              limitIncluded:
                type: boolean
        projectedAccum:
          $ref: '../../events/v1/defs.schema.json#/$defs/won'
          description: 이 계약을 더한 뒤의 예상 누적(v1.3, R2 — 선택). limitAmount가 없으면 없다.
        deferral:
          type: object
          required: [firstYearPayout, schedule]
          properties:
            firstYearPayout:
              $ref: '../../events/v1/defs.schema.json#/$defs/won'
            schedule:
              type: array
              items:
                type: object
                required: [dueYm, amount]
                properties:
                  dueYm:
                    $ref: '../../events/v1/defs.schema.json#/$defs/ym'
                  amount:
                    $ref: '../../events/v1/defs.schema.json#/$defs/won'
        ruleSnapshotId:
          $ref: '../../events/v1/defs.schema.json#/$defs/id'
        generatedAt:
          $ref: '../../events/v1/defs.schema.json#/$defs/instant'
    PolicyEventRequest:
      type: object
      required: [agentId, policyNo, eventType, asOfDate]
      properties:
        agentId:
          $ref: '../../events/v1/defs.schema.json#/$defs/agentId'
        policyNo:
          $ref: '../../events/v1/defs.schema.json#/$defs/id'
        eventType:
          enum: [CANCEL, LAPSE, WITHDRAW, REDUCE, REINSTATE, PAYMENT_OVERDUE]
        asOfDate:
          $ref: '../../events/v1/defs.schema.json#/$defs/date'
        elapsedInstallments:
          type: integer
          minimum: 1
          description: 경과 회차(v1.3, R4 — 선택). 없으면 엔진이 체결일과 asOfDate의 개월 수로 근사한다.
        newMonthlyPremium:
          $ref: '../../events/v1/defs.schema.json#/$defs/nonNegativeWon'
          description: 감액 뒤 월납 보험료(v1.3, R4 — eventType=REDUCE일 때 한도 재산정의 입력, 다른 유형에서는 무시).
    PolicyEventResult:
      type: object
      required: [clawbackAmount, offsetAgainstMonth, receivableRemaining, cancelledDeferrals, ruleSnapshotId]
      properties:
        clawbackAmount:
          $ref: '../../events/v1/defs.schema.json#/$defs/won'
          description: 환수액(v1.3, R5) — ≤ 0, CommissionCalculated(commType CLAWBACK)과 같은 부호.
        offsetAgainstMonth:
          type: object
          required: [closeYm, before, after]
          description: 환수가 귀속되는 달의 세전·채권 상계 전 순액(gross + clawbackOffset)의 전후(v1.3, R5).
          properties:
            closeYm:
              $ref: '../../events/v1/defs.schema.json#/$defs/ym'
            before:
              $ref: '../../events/v1/defs.schema.json#/$defs/won'
            after:
              $ref: '../../events/v1/defs.schema.json#/$defs/won'
        receivableRemaining:
          $ref: '../../events/v1/defs.schema.json#/$defs/won'
          description: 이 이벤트 뒤 그 설계사의 열린 환수 채권 잔액 합(v1.3, R5).
        cancelledDeferrals:
          type: array
          items:
            type: object
            required: [scheduleId, dueYm, amount]
            properties:
              scheduleId:
                $ref: '../../events/v1/defs.schema.json#/$defs/id'
              dueYm:
                $ref: '../../events/v1/defs.schema.json#/$defs/ym'
              amount:
                $ref: '../../events/v1/defs.schema.json#/$defs/won'
        ruleSnapshotId:
          $ref: '../../events/v1/defs.schema.json#/$defs/id'
