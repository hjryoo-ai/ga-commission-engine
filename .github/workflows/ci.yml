name: CI

# 2단 CI (설계서 §8 테스트 전략 + 저장소 협업 규약):
#  - 빠른 티어(모든 푸시/PR): 단위·H2·아키텍처·골든셋 — Docker 불필요, 수 초~수십 초.
#  - 풀 티어(PR + main): Oracle Testcontainers IT + 기동 스모크 — Docker 필요, 수 분.
# dependency verification은 wrapper가 gradle/verification-metadata.xml로 항상 강제한다
# (신뢰 아티팩트만 통과). 이 파일은 초안이니 러너 환경(이미지 캐시 등)에 맞춰 조정할 것.

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TZ: Asia/Seoul            # 결정론 — close_ym·기준일 산정이 환경 타임존에 흔들리지 않게

defaults:
  run:
    working-directory: commission-system   # Gradle 빌드는 이 하위에 있다

jobs:
  fast:
    name: 빠른 티어 (단위/H2 + 골든셋)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (Docker 테스트 제외)
        run: ./gradlew build -x :commission-infra:integrationTest -x :commission-app:test --no-daemon
      - name: 계약 원본 대조 (contracts/UPSTREAM의 ga-disclosure 커밋과 SHA-256 일치, Phase E3)
        run: ./gradlew verifyUpstreamContract --no-daemon
      - name: net.jqwik 부재 확인 (Phase E3-0 — 해석 시 빌드 실패 규칙의 이중 확인)
        run: |
          ./gradlew -q $(./gradlew -q projects | grep -o "':[^']*'" | tr -d "'" | sed 's/$/:dependencies/') > deps.txt
          if grep -q 'net\.jqwik' deps.txt; then echo 'net.jqwik found'; exit 1; fi

  full:
    name: 풀 티어 (Oracle IT + 기동 스모크)
    runs-on: ubuntu-latest    # GitHub-hosted 러너는 Docker 내장 → Testcontainers 동작
    # PR과 main 머지에서만 — oracle-free 이미지(~6GB) 기동 비용 때문에 매 푸시엔 돌리지 않는다.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Full build (Testcontainers Oracle)
        run: ./gradlew build --no-daemon
      # E3.2 심사 §3: 시험 건수의 1차 증거를 CI에도 남긴다(ga-disclosure `test-reports`와 같은 방식 — 보고서가 HTML 카운터로 센다).
      # 경로는 작업 디렉터리가 아니라 저장소 루트 기준이다.
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            commission-system/*/build/reports/tests/
            commission-system/*/build/test-results/**/*.xml
          if-no-files-found: error

  no-docker:
    name: Docker 없음 → 통합 테스트 실패 (스킵 아님)
    # E3 수용 심사 §2-17·§3-8(E3.1 선택 항목): ga-disclosure `no-docker` 잡과 같은 방식. Docker가 없으면 Oracle IT는 스킵이 아니라
    # 실패해야 한다 — 이 잡은 "실패해야 성공"이다. `container:` 방식은 호스트 docker.sock이 마운트되어 Docker가 사라지지 않으므로
    # 호스트 러너에서 데몬을 멈추고 소켓을 지운다(E3의 소켓 오버라이드 확인을 데몬 정지 실측으로 대체).
    # 성공 조건: Gradle 종료 코드 ≠ 0, 결과 XML ≥ 1, 그 안에 Testcontainers의 Docker 미발견 오류, 스킵 0건, 실패한 스위트 ≥ 1.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Stop Docker and remove its socket
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo rm -f /var/run/docker.sock
          if docker info > /dev/null 2>&1; then echo 'Docker is still reachable'; exit 1; fi
          test ! -S /var/run/docker.sock
          echo 'Docker is unavailable'
      - name: commission-infra integrationTest must FAIL without Docker
        shell: bash
        run: |
          set +e
          ./gradlew :commission-infra:integrationTest --no-daemon --console=plain > it.log 2>&1
          code=$?
          set -e
          echo "gradle exit code: $code"
          tail -n 80 it.log
          if [ "$code" -eq 0 ]; then echo 'FAIL: integrationTest passed without Docker'; exit 1; fi
          dir=commission-infra/build/test-results/integrationTest
          results=$(ls $dir/*.xml 2>/dev/null | wc -l)
          if [ "$results" -eq 0 ]; then echo 'FAIL: no test results — the tests did not run'; exit 1; fi
          # 콘솔은 짧은 예외 형식이라 원인이 안 보인다 — 결과 XML의 전체 스택에서 Testcontainers의 Docker 미발견 오류를 찾는다
          if ! grep -q 'Could not find a valid Docker environment' $dir/*.xml; then echo 'FAIL: no Testcontainers Docker-missing error in the results'; exit 1; fi
          if grep -h -o 'skipped="[0-9]*"' $dir/*.xml | grep -v -q 'skipped="0"'; then
            echo 'FAIL: some integration tests were skipped'; exit 1
          fi
          failed=$(grep -l -E '(failures|errors)="[1-9]' $dir/*.xml | wc -l)
          echo "result files: $results, with failures/errors: $failed, skipped: 0"
          if [ "$failed" -eq 0 ]; then echo 'FAIL: no failing test suite'; exit 1; fi
          echo 'OK: integration tests failed (not skipped) because Docker is missing'
